services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: findoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/findoc
    depends_on:
      - db

volumes:
  pgdata: